<ion-content>

  <div class="login">
    <img src="assets/logo-f.png" alt="">
    <br>

    <div class="input-box">
      <div class="icon">
        <ion-icon name="mail-outline"></ion-icon>
      </div>

      <div class="input">
        <input type="email" [(ngModel)]="email" [placeholder]="'login.email' | translate">
      </div>
      <div style="clear: both;"></div>
    </div>

    <div class="input-box">
      <div class="icon">
        <ion-icon name="lock-closed-outline"></ion-icon>
      </div>

      <div class="input">
        <input type="password" [(ngModel)]="password" [placeholder]="'login.password' | translate">
      </div>
      <div style="clear: both;"></div>
    </div>

    <label>
      <input type="checkbox"> <span class="other-text dil">{{'login.remember' | translate}}</span>
    </label>

    <button class="button-login" (click)="login()">
      LOGIN
    </button>

    <span class="other-text">{{'login.not_remember' | translate}} <span [routerLink]="['/recovery']" routerDirection="root">{{'login.recover' | translate}}</span></span>
    <span class="other-text">{{'login.not_account' | translate}} <span  [routerLink]="['/register']" routerDirection="root">{{'login.register' | translate}}</span></span>

  </div>

</ion-content>
