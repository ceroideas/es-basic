<ion-content>

  <div class="login">
    <img src="assets/logo-f.png" alt="">
    <br>

    <div class="input-box">
      <div class="icon">
        <ion-icon name="mail-outline"></ion-icon>
      </div>

      <div class="input">
        <input type="email" [(ngModel)]="email" placeholder="{{'register.email' | translate}}">
      </div>
      <div style="clear: both;"></div>
    </div>

    <div class="input-box">
      <div class="icon">
        <ion-icon name="person-outline"></ion-icon>
      </div>

      <div class="input">
        <input type="text" [(ngModel)]="name" placeholder="{{'register.name' | translate}}">
      </div>
      <div style="clear: both;"></div>
    </div>

    <div class="input-box">
      <div class="icon">
        <ion-icon name="lock-closed-outline"></ion-icon>
      </div>

      <div class="input">
        <input type="password" [(ngModel)]="password" placeholder="{{'register.password' | translate}}">
      </div>
      <div style="clear: both;"></div>
    </div>

    <div class="input-box">
      <div class="icon">
        <ion-icon name="lock-closed-outline"></ion-icon>
      </div>

      <div class="input">
        <input type="password" [(ngModel)]="password_confirmation" placeholder="{{'register.repeat_password' | translate}}">
      </div>
      <div style="clear: both;"></div>
    </div>

    <label>
      <input type="checkbox" [(ngModel)]="terms"> <span class="other-text dil">{{'register.accept' | translate}}</span>
    </label>

    <button class="button-login" (click)="register()" routerDirection="root">
      {{'register.register' | translate}}
    </button>

    <span class="other-text">{{'register.already_account' | translate}} <span  [routerLink]="['/login']" routerDirection="root">{{'register.login' | translate}}</span></span>

  </div>

</ion-content>
